# Stable release: builds the installer, portable zip and update packages for a version tag and publishes them as a
# GitHub release on Velopack's default channel, which installed apps on the Stable channel update from.
name: Release (Windows)

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*' # Dev builds tag themselves v1.2.3-dev.N; those are published by dev-build.yml.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v2.1.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Read version from release tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.release_tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Stable releases must run from a version tag such as v2.1.0. Received: $tag"
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($tag.Substring(1))" >> $env:GITHUB_ENV

      - name: Publish FitOSC
        run: dotnet publish FitOSC/FitOSC.csproj --configuration Release --runtime win-x64 --self-contained --output ./publish -p:Version=$env:RELEASE_VERSION

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Stamp version on splash
        shell: pwsh
        run: ./installer/New-SplashImage.ps1 -Version $env:RELEASE_VERSION -OutputPath ./splash.png

      # The previous release lets vpk build a delta package, so installed apps download only what changed.
      - name: Download previous release
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir ./releases

      - name: Pack installer and update packages
        run: >-
          vpk pack --packId FitOSC --packVersion $env:RELEASE_VERSION --packDir ./publish --mainExe FitOSC.exe
          --packTitle FitOSC --packAuthors Duinrahaic --icon ./FitOSC/Assets/icon.ico
          --splashImage ./splash.png --splashProgressColor "#4caf50" --outputDir ./releases

      - name: Publish GitHub release
        run: >-
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir ./releases --tag $env:RELEASE_TAG --releaseName "FitOSC $env:RELEASE_VERSION" --publish --merge
