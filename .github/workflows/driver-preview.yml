# Unsigned Windows preview build for testing a pull request on hardware. It only builds and uploads a workflow
# artifact: no release, tag, secret or write permission is used, and pull requests from forks get the same
# read-only treatment (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request).
name: Driver preview build (Windows)

on:
  pull_request:
    branches: [development]
  # Builds the selected branch. GitHub only offers this once the workflow file is on the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driver-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # The pull request's own head commit, so the artifact matches a commit listed on the pull request.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Name the preview
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $short = $env:COMMIT.Substring(0, 7)
          $base = ([xml](Get-Content FitOSC/FitOSC.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $label = if ($env:PR_NUMBER) { "pr$($env:PR_NUMBER)" } else { "manual" }
          $version = "$base-preview.$label.$($env:RUN_NUMBER)"
          "PREVIEW_VERSION=$version" >> $env:GITHUB_ENV
          "PREVIEW_NAME=FitOSC-preview-$label-$short-win-x64" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force ./preview | Out-Null
          @(
            "FitOSC preview build - not a release"
            "Version: $version (Settings > About; FitOSC.exe Properties > Details shows $version+<commit>)"
            "Pull request: $(if ($env:PR_NUMBER) { "#$($env:PR_NUMBER)" } else { 'none (manual run)' })"
            "Commit: $($env:COMMIT)"
            "Workflow run: $($env:RUN_URL)"
            ""
            "Self-contained win-x64: no .NET install is needed. Run FitOSC.exe from this folder."
            "Settings and logs are shared with an installed FitOSC: %APPDATA%\FitOSC (logs in %APPDATA%\FitOSC\logs)."
            "Validation steps: docs/driver-validation in the pull request."
          ) | Set-Content -Encoding utf8 ./preview/PREVIEW-BUILD.txt

      - name: Publish self-contained win-x64
        run: dotnet publish FitOSC/FitOSC.csproj --configuration Release --runtime win-x64 --self-contained --output ./preview -p:Version=$env:PREVIEW_VERSION

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PREVIEW_NAME }}
          path: ./preview
          if-no-files-found: error
          retention-days: 30
          overwrite: true
